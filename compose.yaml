services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: muniquant
      POSTGRES_USER: muniquant
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U muniquant -d muniquant"]
      interval: 5s
      timeout: 5s
      retries: 10
  migrate:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://muniquant:${POSTGRES_PASSWORD}@db:5432/muniquant
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
  app:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://muniquant:${POSTGRES_PASSWORD}@db:5432/muniquant
      SNAPSHOT_DIR: /app/data/snapshots
      WRITE_TOKEN: ${WRITE_TOKEN:?Set WRITE_TOKEN in .env}
      WRITE_ACTOR: ${WRITE_ACTOR:-pilot-curator}
      WRITE_IDENTITIES_JSON: ${WRITE_IDENTITIES_JSON:-}
      REQUIRE_READ_AUTH: ${REQUIRE_READ_AUTH:-false}
      READ_TOKEN: ${READ_TOKEN:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - evidence_data:/app/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  postgres_data:
  evidence_data:
