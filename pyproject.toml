[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "muniquant-workspace"
version = "1.0.0rc1"
description = "MuniQuant Workspace: leads, research and practice trading, investigations and the map, on the Data Core API"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "static/media/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tools live outside the runtime package; tests import them from the project root.
pythonpath = ["."]
