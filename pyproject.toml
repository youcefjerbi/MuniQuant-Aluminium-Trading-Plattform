[build-system]
requires = ["setuptools>=75", "pybind11>=2.13,<4"]
build-backend = "setuptools.build_meta"

[project]
name = "muniquant-aluminium"
version = "0.1.0"
description = "Evidence-first industrial and market data platform"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "sqlalchemy>=2.0,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "jsonschema>=4.23,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["static/*", "package.schema.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
