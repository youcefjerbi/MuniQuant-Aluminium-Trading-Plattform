name: Optional evidence trading agents
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  pinned-upstream:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Workspace and pinned optional integration
        run: |
          pip install -r requirements.lock
          pip install --no-build-isolation -e '.[trading-agents]'
      - name: Verify installed upstream provenance
        run: python -c "from app.trading_agent_adapter import _assert_upstream; _assert_upstream()"
      - name: Exercise real upstream factories with fake models and paper guards
        run: pytest -q tests/test_trading_agent*.py
