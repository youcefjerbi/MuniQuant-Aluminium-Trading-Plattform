name: Workspace CI
on: [push, pull_request]
permissions:
  contents: read
env:
  # The Data Core the Workspace is tested against (public; CORE_REPOSITORY_TOKEN is only
  # needed if it becomes private). Pin the v1.0.0 tag at the DC1 handover.
  CORE_REPOSITORY: alekspetrov9e/muniquant-data-core
  CORE_REF: main
jobs:
  test:
    name: Tests and migrations (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: sqlite
            image: postgres:16-alpine
          - database: postgres16
            image: postgres:16-alpine
          - database: postgres17
            image: postgres:17-alpine
    services:
      postgres:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muniquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d muniquant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: ${{ matrix.database != 'sqlite' && 'postgresql+psycopg://test:test@localhost:5432/muniquant_test' || '' }}
      CORE_HOME: ${{ github.workspace }}/core
      CORE_PYTHON: ${{ github.workspace }}/core/.venv/bin/python
    steps:
      - uses: actions/checkout@v4
      - name: Data Core checkout (Workspace tests run against a real Core)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core
          token: ${{ secrets.CORE_REPOSITORY_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Data Core in its own environment
        run: |
          python -m venv core/.venv
          core/.venv/bin/pip install -r core/requirements.lock
          core/.venv/bin/pip install --no-build-isolation -e core
      - run: pip install -r requirements.lock && pip install -e .
      - name: Tests (steps B1-B3 and every Workspace feature against a running Core)
        run: pytest -q
      - name: Setup, drift check and migration round trip
        env:
          DATABASE_URL: ${{ matrix.database != 'sqlite' && 'postgresql+psycopg://test:test@localhost:5432/muniquant_test' || 'sqlite:///data/migration-check.db' }}
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
          alembic check
      - name: Bundled demo database restore
        if: matrix.database == 'sqlite'
        run: |
          python scripts/restore_demo.py
          DATABASE_URL=sqlite:///data/demo.db alembic upgrade head
          DATABASE_URL=sqlite:///data/demo.db alembic check

  container:
    name: Workspace container alone (PostgreSQL 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: muniquant_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U test -d muniquant_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://test:test@localhost:5432/muniquant_test
    steps:
      - uses: actions/checkout@v4
      - name: Container build
        run: docker build -t muniquant-workspace:test .
      - name: Image holds the Workspace only, without Data Core code
        run: |
          docker run --rm muniquant-workspace:test sh -c '! ls app | grep -E "contract|quality|evidence_cli|bundle|pilot|seed|evidence-v1" && ! python -c "import muniquant_core" 2>/dev/null && python -c "import app.main"'
      - name: Migrations and runtime without a Core
        run: |
          docker run --rm --network host -e DATABASE_URL muniquant-workspace:test alembic upgrade head
          docker run --name workspace-alone --network host -d -e DATABASE_URL -e WRITE_TOKEN=ci-only-fixture-token -e CORE_URL=http://127.0.0.1:9 muniquant-workspace:test
          trap 'docker logs workspace-alone; docker rm -f workspace-alone' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/api/health; then break; fi
            sleep 1
          done
          # The Workspace runs alone; its health says the Core is unavailable, and Core-backed pages say so too.
          curl --fail --silent http://127.0.0.1:8000/api/health | python3 -c "import json,sys; h=json.load(sys.stdin); assert h['status']=='ok' and h['core']['status']=='unavailable', h"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8000/api/core/catalog)" = 503
          curl --fail --silent http://127.0.0.1:8000/api/research > /dev/null

  together:
    name: Data Core and Workspace together (Docker Compose)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Data Core checkout
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CORE_REPOSITORY }}
          ref: ${{ env.CORE_REF }}
          path: core
          token: ${{ secrets.CORE_REPOSITORY_TOKEN || github.token }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Start both
        run: |
          python -c "import secrets; names=['POSTGRES_PASSWORD','WRITE_TOKEN','CORE_TOKEN','CORE_POSTGRES_PASSWORD','CORE_WRITE_TOKEN']; print('\n'.join(n+'='+secrets.token_hex(24) for n in names))" > .env
          echo "CORE_HOME=$PWD/core" >> .env
          docker compose -f compose.together.yaml up --build -d --wait
      - name: One test that runs them together
        run: |
          pip install -r requirements.lock && pip install -e .
          set -a; . ./.env; set +a
          TOGETHER_REQUIRED=1 TOGETHER_CORE_URL=http://127.0.0.1:8000 TOGETHER_CORE_WRITE_TOKEN=$CORE_WRITE_TOKEN \
          TOGETHER_WORKSPACE_URL=http://127.0.0.1:8001 TOGETHER_WRITE_TOKEN=$WRITE_TOKEN \
          pytest -q tests/test_together.py -rs
      - name: Logs
        if: failure()
        run: docker compose -f compose.together.yaml logs
      - name: Stop
        if: always()
        run: docker compose -f compose.together.yaml down -v
